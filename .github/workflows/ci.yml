name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"
  PROMETHEUS_VERSION: "2.51.0"
  KUBECONFORM_VERSION: "0.6.7"
  HELM_VERSION: "v3.16.2"

jobs:
  # ── Go Ingestor ────────────────────────────────────────────
  go-lint-test:
    name: Go Lint & Test (ingestor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ingestor/go.sum

      - name: Verify modules
        run: go mod verify

      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (with race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ingestor/coverage.out

  # ── Go SDK ─────────────────────────────────────────────────
  sdk-test:
    name: Go SDK Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sdk/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Test (race, repeated to surface timing flakes)
        run: go test -race -count=3 ./...

  # ── Rust Processor ─────────────────────────────────────────
  rust-lint-test:
    name: Rust Lint & Test (processor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./processor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config libcurl4-openssl-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            processor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('processor/Cargo.lock') }}

      - name: Format Check
        run: cargo fmt -- --check

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # ── Prometheus rules ───────────────────────────────────────
  prometheus-rules:
    name: Prometheus Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool
        run: |
          curl -sSfL "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Check and unit-test rules
        run: make rules-test

  # ── Helm ───────────────────────────────────────────────────
  helm:
    name: Helm Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Chart rules match infra/prometheus
        run: make helm-check-rules

      - name: Helm Lint
        run: make helm-lint

      - name: Render and validate against Kubernetes schemas
        run: |
          CRDS='https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for args in "" \
            "--set serviceMonitor.enabled=true --set prometheusRule.enabled=true --set processor.kedaScaling.enabled=true" \
            "--set processor.autoscaling.enabled=true --set networkPolicies.enabled=false"; do
            echo "::group::helm template $args"
            helm template obs helm/observability-pipeline $args \
              | kubeconform -strict -summary -kubernetes-version 1.29.0 \
                  -schema-location default -schema-location "$CRDS"
            echo "::endgroup::"
          done

      - name: Guards reject invalid configurations
        run: |
          expect_fail() {
            if helm template obs helm/observability-pipeline "$@" >/dev/null 2>&1; then
              echo "expected render failure for: $*"; exit 1
            fi
          }
          expect_fail --set processor.autoscaling.enabled=true --set processor.kedaScaling.enabled=true
          expect_fail --set processor.kedaScaling.enabled=true --set processor.kedaScaling.maxReplicas=12
          expect_fail --set processor.replicaCount=8
          expect_fail --set processor.config.clickhouseUrl=http://clickhouse:8123/observability
          expect_fail --set ingestor.config.drainDelaySeconds=5

  # ── Supply Chain Security ──────────────────────────────────
  security:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        working-directory: ./ingestor

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust advisories
        run: cargo install cargo-audit --locked && cargo audit
        working-directory: ./processor

  # Full-stack checks run nightly so ordinary PRs do not need a Kafka/ClickHouse stack.
  integration-chaos:
    name: Integration and Chaos
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:8123/ping >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Assert end-to-end data path
        run: make integration-test
      - name: Run recovery scenarios
        run: |
          SENT=500 RATE=500 KILL_AFTER_SECS=2 make chaos-kill9
          WARMUP_SECONDS=2 OUTAGE_DURATION=5 COOLDOWN_SECONDS=2 RATE=50 make chaos-clickhouse
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Docker Build ───────────────────────────────────────────
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [go-lint-test, sdk-test, rust-lint-test, helm, prometheus-rules]
    steps:
      - uses: actions/checkout@v4

      - name: Build Ingestor Image
        run: docker build -t observability-pipeline/ingestor:${{ github.sha }} ./ingestor

      - name: Build Processor Image
        run: docker build -t observability-pipeline/processor:${{ github.sha }} ./processor

      # Pinned: a moving @master tag lets an upstream change alter what this
      # job executes with no change in this repository.
      - name: Trivy Image Scan (Ingestor)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: observability-pipeline/ingestor:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy Image Scan (Processor)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: observability-pipeline/processor:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate Ingestor SBOM
        uses: anchore/sbom-action@v0
        with:
          image: observability-pipeline/ingestor:${{ github.sha }}
          artifact-name: ingestor-sbom.spdx.json

      - name: Generate Processor SBOM
        uses: anchore/sbom-action@v0
        with:
          image: observability-pipeline/processor:${{ github.sha }}
          artifact-name: processor-sbom.spdx.json
