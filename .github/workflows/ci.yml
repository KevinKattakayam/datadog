name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"
  RUST_VERSION: "stable"

jobs:
  # ── Go Ingestor ────────────────────────────────────────────
  go-lint-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ingestor/coverage.out

  # ── Rust Processor ─────────────────────────────────────────
  rust-lint-test:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./processor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            processor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('processor/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format Check
        run: cargo fmt -- --check

      - name: Test
        run: cargo test

  # ── Docker Build ───────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-lint-test, rust-lint-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Ingestor Image
        run: docker build -t observability-pipeline/ingestor:${{ github.sha }} ./ingestor

      - name: Build Processor Image
        run: docker build -t observability-pipeline/processor:${{ github.sha }} ./processor
