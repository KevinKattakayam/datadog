name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  GO_VERSION: "1.22"
  RUST_VERSION: "stable"

jobs:
  # ── Go Ingestor ────────────────────────────────────────────
  go-lint-test:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ingestor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go Vet
        run: go vet ./...

      - name: Go Test (with race detector)
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: ingestor/coverage.out

  # ── Rust Processor ─────────────────────────────────────────
  rust-lint-test:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./processor
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            processor/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('processor/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Format Check
        run: cargo fmt -- --check

      - name: Test
        run: cargo test

  # ── Helm Lint ──────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Build chart dependencies
        run: helm dependency build helm/observability-pipeline/

      - name: Helm Lint
        run: helm lint helm/observability-pipeline/

      - name: Helm Template (validate rendering)
        run: helm template test helm/observability-pipeline/ > /dev/null

  # ── Supply Chain Security ──────────────────────────────────
  security:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: ./ingestor

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust advisories
        run: cargo install cargo-audit && cargo audit
        working-directory: ./processor

  # Full-stack checks run nightly so ordinary PRs do not need a Kafka/ClickHouse stack.
  integration-chaos:
    name: Integration and Chaos
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local stack
        run: docker compose up -d --build
      - name: Wait for services
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null && curl -fsS http://localhost:8123/ping >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1
      - name: Assert end-to-end data path
        run: make integration-test
      - name: Run recovery scenarios
        run: |
          SENT=500 RATE=500 KILL_AFTER_SECS=2 make chaos-kill9
          WARMUP_SECONDS=2 OUTAGE_DURATION=5 COOLDOWN_SECONDS=2 RATE=50 make chaos-clickhouse
      - name: Stop stack
        if: always()
        run: docker compose down -v --remove-orphans

  # ── Docker Build ───────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-lint-test, rust-lint-test, helm-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Build Ingestor Image
        run: docker build -t observability-pipeline/ingestor:${{ github.sha }} ./ingestor

      - name: Build Processor Image
        run: docker build -t observability-pipeline/processor:${{ github.sha }} ./processor

      - name: Trivy Image Scan (Ingestor)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: observability-pipeline/ingestor:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy Image Scan (Processor)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: observability-pipeline/processor:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Generate Ingestor SBOM
        uses: anchore/sbom-action@v0
        with:
          image: observability-pipeline/ingestor:${{ github.sha }}
          artifact-name: ingestor-sbom.spdx.json

      - name: Generate Processor SBOM
        uses: anchore/sbom-action@v0
        with:
          image: observability-pipeline/processor:${{ github.sha }}
          artifact-name: processor-sbom.spdx.json
