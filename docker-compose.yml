# ============================================================
#  Enterprise Observability Pipeline — Docker Compose
#  Single-node local development stack
# ============================================================

services:
  # ── Kafka (KRaft mode — no ZooKeeper) ──────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: obs-kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Kafka Topic Initializer ────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: obs-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics.raw --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics.processed --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic alerts.fired --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic metrics.dlq --partitions 3 --replication-factor 1 --config retention.ms=604800000
      echo 'Topics created successfully.'
      kafka-topics --bootstrap-server kafka:9092 --list
      "
    networks:
      - observability-net

  # ── Kafka Exporter (Prometheus metrics for Kafka) ──────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: obs-kafka-exporter
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
    ports:
      - "9308:9308"
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── ClickHouse (columnar long-term storage) ────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: obs-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infra/clickhouse/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    environment:
      CLICKHOUSE_DB: observability
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Prometheus (time-series database + scraper) ────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: obs-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts/:/etc/prometheus/alerts/:ro
      - ./infra/prometheus/rules/:/etc/prometheus/rules/:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-admin-api
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ── AlertManager ───────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: obs-alertmanager
    ports:
      - "9094:9093"
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Grafana (visualization + alerting UI) ──────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: obs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pipeline.json
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./infra/grafana/provisioning/:/etc/grafana/provisioning/:ro
      - ./infra/grafana/dashboards/:/var/lib/grafana/dashboards/:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Go Ingestor ────────────────────────────────────────────
  ingestor:
    build:
      context: ./ingestor
      dockerfile: Dockerfile
    container_name: obs-ingestor
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: metrics.raw
      INGESTOR_PORT: "8080"
      INGESTOR_GRPC_PORT: "50051"
      INGESTOR_LOG_LEVEL: info
      INGESTOR_BATCH_SIZE: "500"
      INGESTOR_FLUSH_INTERVAL_MS: "100"
      INGESTOR_RATE_LIMIT_RPS: "10000"
      REDIS_URL: redis:6379
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Rust Processor ─────────────────────────────────────────
  processor:
    build:
      context: ./processor
      dockerfile: Dockerfile
    container_name: obs-processor
    ports:
      - "9091:9091"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_RAW: metrics.raw
      KAFKA_TOPIC_PROCESSED: metrics.processed
      KAFKA_TOPIC_ALERTS: alerts.fired
      KAFKA_TOPIC_DLQ: metrics.dlq
      KAFKA_CONSUMER_GROUP: processor-group
      CLICKHOUSE_URL: http://clickhouse:8123
      PROCESSOR_LOG_LEVEL: info
      PROCESSOR_METRICS_PORT: "9091"
      PROCESSOR_BATCH_SIZE: "1000"
      PROCESSOR_FLUSH_INTERVAL_MS: "500"
      PROCESSOR_EWMA_ALPHA: "0.3"
      PROCESSOR_ZSCORE_WINDOW: "300"
      PROCESSOR_ANOMALY_THRESHOLD: "3.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Grafana Tempo (distributed tracing backend) ─────────────
  tempo:
    image: grafana/tempo:2.4.1
    container_name: obs-tempo
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Jaeger (trace visualization UI) ─────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: obs-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "50000"
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis (metric caching layer) ────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: obs-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Confluent Schema Registry (Avro validation) ─────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: obs-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Schema Registry Initializer ─────────────────────────────
  schema-init:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: obs-schema-init
    depends_on:
      - schema-registry
    volumes:
      - ./infra/schema-registry/schemas/:/etc/schema-registry/schemas/:ro
      - ./infra/schema-registry/register-schemas.sh:/register-schemas.sh:ro
    entrypoint: ["/bin/bash", "/register-schemas.sh"]
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - observability-net

  # ── Kafka Connect (sink connectors) ─────────────────────────
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: obs-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: obs-connect-group
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    volumes:
      - ./infra/kafka-connect/:/etc/kafka-connect/
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ── OpenTelemetry Collector ─────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: obs-otel-collector
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./infra/otel-collector/config.yml:/etc/otel/config.yml:ro
    ports:
      - "4319:4317"
      - "4320:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - tempo
      - jaeger
    networks:
      - observability-net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  kafka-data:
  clickhouse-data:
  prometheus-data:
  grafana-data:
  tempo-data:
  redis-data:

networks:
  observability-net:
    driver: bridge

