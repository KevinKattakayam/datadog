apiVersion: v2
name: observability-pipeline
description: Enterprise-grade distributed observability pipeline with Go, Rust, Kafka, and ClickHouse
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - observability
  - monitoring
  - kafka
  - clickhouse
  - prometheus
  - grafana
  - distributed-tracing

maintainers:
  - name: Kevin Bastin
    url: https://github.com/KevinKattakayam

dependencies:
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: clickhouse
    version: "4.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: clickhouse.enabled
