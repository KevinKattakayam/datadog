{{- include "obs.validate" . }}
{{- $v := .Values.ingestor }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obs.fullname" . }}-ingestor
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestor
    {{- include "obs.labels" . | nindent 4 }}
spec:
  {{- if not $v.autoscaling.enabled }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: ingestor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 2
  template:
    metadata:
      labels:
        app: ingestor
        {{- include "obs.labels" . | nindent 8 }}
      annotations:
        # Roll pods when the key Secret's name changes; content rotation is
        # picked up live by the ingestor's key watcher.
        checksum/api-keys-secret: {{ $v.apiKeysSecret | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ include "obs.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ingestor
          image: {{ include "obs.image" (dict "root" . "image" $v.image) | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml $v.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $v.service.httpPort }}
              protocol: TCP
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $v.config.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_RAW
              value: {{ $v.config.kafkaTopicRaw | quote }}
            - name: INGESTOR_PORT
              value: {{ $v.service.httpPort | quote }}
            - name: INGESTOR_BATCH_SIZE
              value: {{ $v.config.batchSize | quote }}
            - name: INGESTOR_FLUSH_INTERVAL_MS
              value: {{ $v.config.flushIntervalMs | quote }}
            - name: INGESTOR_RATE_LIMIT_RPS
              value: {{ $v.config.rateLimitRPS | quote }}
            - name: INGESTOR_TENANT_METRICS_PER_SEC
              value: {{ $v.config.tenantMetricsPerSec | quote }}
            - name: INGESTOR_MAX_BODY_MIB
              value: {{ $v.config.maxBodyMiB | quote }}
            - name: INGESTOR_LOG_LEVEL
              value: {{ $v.config.logLevel | quote }}
            - name: API_KEYS_PATH
              value: {{ $v.config.apiKeysPath | quote }}
            - name: API_KEYS_RELOAD_INTERVAL_SECONDS
              value: {{ $v.config.apiKeysReloadIntervalSeconds | quote }}
            - name: AUTH_ALLOW_INSECURE_DEV
              value: "false"
            - name: INGESTOR_DRAIN_DELAY_SECONDS
              value: {{ $v.config.drainDelaySeconds | quote }}
          livenessProbe:
            httpGet:
              path: {{ $v.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $v.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $v.probes.liveness.periodSeconds }}
            failureThreshold: {{ $v.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $v.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $v.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $v.probes.readiness.periodSeconds }}
            failureThreshold: {{ $v.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            - name: api-keys
              # Mount the directory, not a subPath: Kubernetes only updates
              # Secret volumes in place (enabling live key rotation) when
              # they are mounted without subPath.
              mountPath: {{ dir $v.config.apiKeysPath }}
              readOnly: true
      volumes:
        - name: api-keys
          secret:
            secretName: {{ $v.apiKeysSecret | quote }}
            defaultMode: 0440
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs.fullname" . }}-ingestor
  namespace: {{ .Values.global.namespace }}
  labels:
    app: ingestor
    {{- include "obs.labels" . | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  ports:
    - name: http
      port: {{ $v.service.httpPort }}
      targetPort: http
      protocol: TCP
  selector:
    app: ingestor
{{- if $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "obs.fullname" . }}-ingestor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "obs.fullname" . }}-ingestor
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.autoscaling.targetCPUUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ $v.autoscaling.targetMemoryUtilization }}
{{- end }}
{{- if $v.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "obs.fullname" . }}-ingestor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $v.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: ingestor
{{- end }}
