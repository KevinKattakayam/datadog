{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
# ── Ingestor ────────────────────────────────────────────────
# Ingress: clients (via Ingress/LoadBalancer) and scrapers on the HTTP port.
# Egress: Kafka and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "obs.fullname" . }}-ingestor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: ingestor
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: {{ .Values.ingestor.service.httpPort }}
          protocol: TCP
  egress:
    - to:
        {{- toYaml $np.kafkaPeers | nindent 8 }}
      ports:
        - port: {{ $np.kafkaPort }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# ── Processor ───────────────────────────────────────────────
# Ingress: metrics scrapers only — nothing else calls the processor.
# Egress: Kafka, ClickHouse, DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: processor
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml $np.metricsScrapers | nindent 8 }}
      ports:
        - port: {{ .Values.processor.service.metricsPort }}
          protocol: TCP
  egress:
    - to:
        {{- toYaml $np.kafkaPeers | nindent 8 }}
      ports:
        - port: {{ $np.kafkaPort }}
          protocol: TCP
    - to:
        {{- toYaml $np.clickhousePeers | nindent 8 }}
      ports:
        - port: {{ $np.clickhousePort }}
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
