{{- $v := .Values.processor }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    app: processor
    {{- include "obs.labels" . | nindent 4 }}
spec:
  {{- if not (or $v.autoscaling.enabled $v.kedaScaling.enabled) }}
  replicas: {{ $v.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # One consumer at a time: each replacement triggers a cooperative
      # rebalance, and surging past the partition count adds idle members.
      maxUnavailable: 1
      maxSurge: 0
  template:
    metadata:
      labels:
        app: processor
        {{- include "obs.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "obs.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $v.terminationGracePeriodSeconds }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: processor
          image: {{ include "obs.image" (dict "root" . "image" $v.image) | quote }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- toYaml $v.containerSecurityContext | nindent 12 }}
          ports:
            - name: metrics
              containerPort: {{ $v.service.metricsPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            # Not ready while ClickHouse is unreachable or the circuit is
            # open. Liveness stays green: restarting would not help.
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $v.config.kafkaBootstrapServers | quote }}
            - name: KAFKA_TOPIC_RAW
              value: {{ $v.config.kafkaTopicRaw | quote }}
            - name: KAFKA_TOPIC_ALERTS
              value: {{ $v.config.kafkaTopicAlerts | quote }}
            - name: KAFKA_TOPIC_DLQ
              value: {{ $v.config.kafkaTopicDlq | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ $v.config.consumerGroup | quote }}
            - name: CLICKHOUSE_URL
              value: {{ $v.config.clickhouseUrl | quote }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $v.config.clickhouseCredentialsSecret | quote }}
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $v.config.clickhouseCredentialsSecret | quote }}
                  key: password
            - name: PROCESSOR_METRICS_PORT
              value: {{ $v.service.metricsPort | quote }}
            - name: PROCESSOR_BATCH_SIZE
              value: {{ $v.config.batchSize | quote }}
            - name: PROCESSOR_FLUSH_INTERVAL_MS
              value: {{ $v.config.flushIntervalMs | quote }}
            - name: PROCESSOR_EWMA_ALPHA
              value: {{ $v.config.ewmaAlpha | quote }}
            - name: PROCESSOR_ZSCORE_WINDOW
              value: {{ $v.config.zscoreWindow | quote }}
            - name: PROCESSOR_ANOMALY_THRESHOLD
              value: {{ $v.config.anomalyThreshold | quote }}
            - name: PROCESSOR_DETECTOR_CAPACITY
              value: {{ $v.config.detectorCapacity | quote }}
            - name: PROCESSOR_MAX_WRITE_ATTEMPTS
              value: {{ $v.config.maxWriteAttempts | quote }}
            - name: PROCESSOR_CLICKHOUSE_TIMEOUT_MS
              value: {{ $v.config.clickhouseTimeoutMs | quote }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    app: processor
    {{- include "obs.labels" . | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  ports:
    - name: metrics
      port: {{ $v.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    app: processor
{{- if $v.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "obs.fullname" . }}-processor
  minReplicas: {{ $v.autoscaling.minReplicas }}
  maxReplicas: {{ $v.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $v.autoscaling.targetCPUUtilization }}
{{- end }}
{{- if $v.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ $v.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app: processor
{{- end }}
{{- if $v.kedaScaling.enabled }}
---
# Scales on consumer-group lag. maxReplicaCount is validated against
# kafka.rawTopicPartitions in _helpers.tpl: a consumer beyond the partition
# count receives no partitions.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "obs.fullname" . }}-processor
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "obs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    name: {{ include "obs.fullname" . }}-processor
  minReplicaCount: {{ $v.kedaScaling.minReplicas }}
  maxReplicaCount: {{ $v.kedaScaling.maxReplicas }}
  cooldownPeriod: 300
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: {{ $v.config.kafkaBootstrapServers | quote }}
        consumerGroup: {{ $v.config.consumerGroup | quote }}
        topic: {{ $v.config.kafkaTopicRaw | quote }}
        lagThreshold: {{ $v.kedaScaling.kafkaLagThreshold | quote }}
        allowIdleConsumers: "false"
{{- end }}
