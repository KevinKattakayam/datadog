# ============================================================
#  Helm Values — Observability Pipeline v2
#  Override these values for different environments
# ============================================================

global:
  namespace: observability
  environment: production
  imageRegistry: ""
  imagePullSecrets: []

# ── Go Ingestor ──────────────────────────────────────────────
ingestor:
  replicaCount: 3
  image:
    repository: observability-pipeline/ingestor
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    metricsPort: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  config:
    kafkaBootstrapServers: kafka:9092
    kafkaTopicRaw: metrics.raw
    batchSize: 500
    flushIntervalMs: 100
    rateLimitRPS: 10000
    logLevel: info
    apiKeysPath: /etc/secrets/api-keys
    drainDelaySeconds: 15
  apiKeysSecret: observability-api-keys
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 10
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: [ingestor]
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: ingestor

# ── Rust Processor ───────────────────────────────────────────
processor:
  replicaCount: 3
  image:
    repository: observability-pipeline/processor
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    metricsPort: 9091
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 512Mi
  autoscaling:
    # Kafka consumers should scale from lag via KEDA, not CPU. Disabled until
    # the KEDA CRD/operator is installed in the target cluster.
    enabled: false
    minReplicas: 3
    # Must not exceed partition count: 6 partitions → max 6 consumers.
    # Extra replicas sit idle but still consume cluster resources.
    maxReplicas: 6
    targetCPUUtilization: 60
  kedaScaling:
    # KEDA-based scaling off Kafka consumer lag is strictly better than
    # CPU-based HPA for a consumer that blocks on I/O, not computation.
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    kafkaLagThreshold: "100"
  config:
    kafkaBootstrapServers: kafka:9092
    kafkaTopicRaw: metrics.raw
    kafkaTopicProcessed: metrics.processed
    kafkaTopicAlerts: alerts.fired
    kafkaTopicDlq: metrics.dlq
    consumerGroup: processor-group
    clickhouseUrl: http://clickhouse:8123/observability
    clickhouseCredentialsSecret: observability-clickhouse-processor
    batchSize: 1000
    flushIntervalMs: 500
    ewmaAlpha: "0.3"
    zscoreWindow: "300"
    anomalyThreshold: "3.0"
    detectorCapacity: "100000"
    maxWriteAttempts: "5"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app: processor

# ── Kafka (Bitnami subchart) ────────────────────────────────
kafka:
  enabled: true
  replicaCount: 3
  kraft:
    enabled: true
  listeners:
    client:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  persistence:
    enabled: true
    size: 50Gi
    storageClass: gp3
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  metrics:
    kafka:
      enabled: true
    jmx:
      enabled: true

# ── ClickHouse ───────────────────────────────────────────────
clickhouse:
  enabled: true
  replicaCount: 2
  shards: 1
  persistence:
    enabled: true
    size: 100Gi
    storageClass: gp3
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi

# ── Prometheus ───────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.51.0
  retention: 15d
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  persistence:
    enabled: true
    size: 50Gi
    storageClass: gp3

# ── Grafana ──────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "10.4.0"
  # Use Kubernetes secret, not chart values
  adminUser: admin
  adminPasswordSecret: grafana-admin-secret
  plugins:
    - grafana-clickhouse-datasource
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi

# ── Grafana Tempo ────────────────────────────────────────────
tempo:
  enabled: true
  image:
    repository: grafana/tempo
    tag: "2.4.1"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  persistence:
    enabled: true
    size: 20Gi

# ── Jaeger ───────────────────────────────────────────────────
jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.55"
  storage:
    type: memory
    maxTraces: 50000

# ── OpenTelemetry Collector ──────────────────────────────────
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.96.0"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── AlertManager ─────────────────────────────────────────────
alertmanager:
  enabled: true
  # Credentials reference Kubernetes secrets, never chart values
  slackWebhookSecret: alertmanager-slack-secret
  pagerdutyRoutingKeySecret: alertmanager-pagerduty-secret

# ── Network Policies ────────────────────────────────────────
networkPolicies:
  enabled: true

# ── Service Monitor (Prometheus Operator) ────────────────────
serviceMonitor:
  enabled: false
  interval: 10s
