# ============================================================
#  Helm Values — Observability Pipeline
#
#  This chart deploys the two services this repository builds: the Go
#  ingestor and the Rust processor. Kafka, ClickHouse and the monitoring
#  stack are external dependencies, by design:
#
#  - Stateful systems belong to their operators (Strimzi, Altinity
#    clickhouse-operator) or managed services (MSK, ClickHouse Cloud), with
#    their own upgrade, backup and scaling lifecycle.
#  - Monitoring belongs to kube-prometheus-stack. This chart ships a
#    ServiceMonitor and PrometheusRule for it instead of a private Prometheus.
#
#  Required before install (see README "Deploying to Kubernetes"):
#    - Secret <ingestor.apiKeysSecret>       key: api-keys
#    - Secret <processor.config.clickhouseCredentialsSecret>  keys: username, password
#    - Kafka topics created with RF>=3, min.insync.replicas=2
# ============================================================

global:
  namespace: observability
  imageRegistry: ""
  imagePullSecrets: []

# Partition count of the raw topic. Consumers beyond this sit idle, so every
# processor scaling bound is validated against it at render time.
kafka:
  rawTopicPartitions: 6

# ── Go Ingestor ──────────────────────────────────────────────
ingestor:
  replicaCount: 3
  image:
    repository: observability-pipeline/ingestor
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  config:
    kafkaBootstrapServers: kafka:9092
    kafkaTopicRaw: metrics.raw
    batchSize: 500
    flushIntervalMs: 100
    # Per-tenant limits, per replica. With N replicas the cluster-wide limit
    # is N times these; see docs/ARCHITECTURE.md trade-offs.
    rateLimitRPS: 10000
    tenantMetricsPerSec: 50000
    maxBodyMiB: 5
    logLevel: info
    apiKeysPath: /etc/secrets/api-keys
    apiKeysReloadIntervalSeconds: 30
    # Readiness must fail and the endpoint be removed before the server
    # stops accepting: drainDelaySeconds >= readiness period x failureThreshold.
    drainDelaySeconds: 15
  apiKeysSecret: observability-api-keys
  # drainDelay (15) + HTTP shutdown (<=25) + producer flush, with margin.
  terminationGracePeriodSeconds: 45
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 15
      failureThreshold: 3
    readiness:
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values: [ingestor]
            topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      # ScheduleAnyway: a zone outage must not block rescheduling.
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: ingestor

# ── Rust Processor ───────────────────────────────────────────
processor:
  replicaCount: 3
  image:
    repository: observability-pipeline/processor
    tag: "2.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    metricsPort: 9091
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 512Mi
  autoscaling:
    # CPU is the wrong signal for a consumer that waits on I/O. Prefer
    # kedaScaling (lag-based). Enabling both is rejected at render time.
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    targetCPUUtilization: 60
  kedaScaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 6
    kafkaLagThreshold: "1000"
  config:
    kafkaBootstrapServers: kafka:9092
    kafkaTopicRaw: metrics.raw
    kafkaTopicAlerts: alerts.fired
    kafkaTopicDlq: metrics.dlq
    consumerGroup: processor-group
    # Base URL only. The database is selected by the client; a path here
    # is sent with every HTTP request and ClickHouse answers 404.
    clickhouseUrl: http://clickhouse:8123
    clickhouseCredentialsSecret: observability-clickhouse-processor
    batchSize: 1000
    flushIntervalMs: 500
    ewmaAlpha: "0.3"
    zscoreWindow: "300"
    anomalyThreshold: "3.0"
    detectorCapacity: "100000"
    maxWriteAttempts: "5"
    clickhouseTimeoutMs: "10000"
  # SIGTERM triggers a final flush+commit. Worst case is maxWriteAttempts x
  # clickhouseTimeoutMs plus backoff (~55s with these values). If the grace
  # period expires first nothing is lost: offsets stay uncommitted and the
  # partition's next owner replays.
  terminationGracePeriodSeconds: 75
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  podDisruptionBudget:
    enabled: true
    # maxUnavailable, not minAvailable: during a ClickHouse outage every
    # processor reports not-ready, and minAvailable would then block node
    # drains entirely.
    maxUnavailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: processor

serviceAccount:
  create: true
  # Neither service calls the Kubernetes API.
  automountToken: false

# ── Network policies ────────────────────────────────────────
# Egress destinations are environment-specific (in-cluster operators vs
# managed endpoints), so they are given as raw NetworkPolicyPeer lists.
networkPolicies:
  enabled: true
  kafkaPort: 9092
  clickhousePort: 8123
  kafkaPeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kafka
  clickhousePeers:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: clickhouse
  # Who may scrape /metrics (kube-prometheus-stack runs in "monitoring").
  metricsScrapers:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring

# ── kube-prometheus-stack integration ────────────────────────
# Requires the monitoring.coreos.com CRDs.
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}
prometheusRule:
  enabled: false
  labels: {}
