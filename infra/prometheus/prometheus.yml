# ============================================================
#  Prometheus Configuration
# ============================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

# Alert rules
rule_files:
  - /etc/prometheus/alerts/pipeline.yml
  - /etc/prometheus/alerts/slo.yml
  - /etc/prometheus/rules/recording.yml

# AlertManager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape targets
scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Go Ingestor
  - job_name: go-ingestor
    metrics_path: /metrics
    static_configs:
      - targets: ["ingestor:8080"]
        labels:
          service: ingestor
          language: go

  # Rust Processor
  - job_name: rust-processor
    metrics_path: /metrics
    static_configs:
      - targets: ["processor:9091"]
        labels:
          service: processor
          language: rust

  # Kafka Exporter
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
        labels:
          service: kafka

  # ClickHouse
  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:8123"]
        labels:
          service: clickhouse

  # OpenTelemetry Collector
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector

  # OpenTelemetry Collector (exported metrics)
  - job_name: otel-exported
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          service: otel-exported

  # Grafana Tempo
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo

  # Kafka Connect
  - job_name: kafka-connect
    metrics_path: /
    static_configs:
      - targets: ["kafka-connect:8083"]
        labels:
          service: kafka-connect

