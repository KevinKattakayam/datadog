apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestor
  namespace: observability
  labels:
    app: ingestor
    component: pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingestor
  template:
    metadata:
      labels:
        app: ingestor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ingestor
          image: observability-pipeline/ingestor:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-0.kafka-headless.observability.svc.cluster.local:9092,kafka-1.kafka-headless.observability.svc.cluster.local:9092,kafka-2.kafka-headless.observability.svc.cluster.local:9092"
            - name: KAFKA_TOPIC_RAW
              value: "metrics.raw"
            - name: INGESTOR_PORT
              value: "8080"
            - name: INGESTOR_LOG_LEVEL
              value: "info"
            - name: INGESTOR_BATCH_SIZE
              value: "500"
            - name: INGESTOR_RATE_LIMIT_RPS
              value: "50000"
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ingestor
  namespace: observability
  labels:
    app: ingestor
spec:
  selector:
    app: ingestor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestor-hpa
  namespace: observability
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestor
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
