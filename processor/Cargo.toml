[package]
name = "processor"
version = "2.0.0"
edition = "2021"
description = "Observability Pipeline — Rust Kafka Consumer & Anomaly Detector"

[dependencies]
# Kafka consumer
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ClickHouse client
clickhouse = { version = "0.13", features = ["inserter"] }

# HTTP server for /metrics endpoint
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

# Prometheus metrics
prometheus = { version = "0.14", features = ["process"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Configuration
envy = "0.4"

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Lazy initialization
once_cell = "1"

# Graceful shutdown
tokio-util = "0.7"

# LRU cache for bounded detector state
lru = "0.12"

# Fast random for jittered backoff
fastrand = "2"
